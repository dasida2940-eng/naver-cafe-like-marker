<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  body { width: 236px; margin: 0; padding: 12px; font: 13px "Malgun Gothic", sans-serif; color: #222; }
  h1, h2 { font-size: 12px; color: #666; margin: 10px 0 5px; font-weight: bold; }
  h2.sec { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; color: #222; font-size: 13px; }
  /* 한 줄에 놓는 선택지 */
  .chips { display: flex; gap: 4px; }
  .chips label { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 2px 6px; border: 1px solid #e6e6ea; border-radius: 7px; cursor: pointer; font-size: 11px; color: #555; }
  .chips label:hover { background: #f7f7f9; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips label:has(input:checked) { border-color: #ff4d6d; background: #fff0f3; color: #d63a5a; font-weight: bold; }
  .pv { display: flex; align-items: center; gap: 3px; height: 15px; }
  .bg { display: inline-block; width: 22px; height: 12px; background: #fff0f3; border: 1px solid #f3c2cd; border-radius: 3px; }
  .heart { display: inline-block; padding: 0 5px; border-radius: 8px; background: #ff4d6d; color: #fff; font-size: 10px; line-height: 15px; font-weight: bold; }
  #style.off { opacity: .4; pointer-events: none; }
  .opt { display: flex; align-items: center; gap: 6px; margin: 10px 0 0; font-size: 12px; cursor: pointer; }
  .count { margin-top: 6px; color: #999; font-size: 11px; }
  .imsg { margin: 0 0 7px; color: #666; font-size: 12px; line-height: 1.45; white-space: pre-line; }
  .imsg b { color: #d63a5a; }
  .ibtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .ibtns:empty { display: none; }
  .ibtns button { padding: 6px 10px; border: 1px solid #e3e3e8; border-radius: 6px; background: #f6f6f8; color: #333; font: bold 12px "Malgun Gothic", sans-serif; cursor: pointer; }
  .ibtns button:hover { background: #ececf0; }
  .ibtns button.primary { border-color: #ff4d6d; background: #ff4d6d; color: #fff; }
  .ibtns button.primary:hover { background: #f03a5c; }
  .power { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 8px; background: #fff0f3; cursor: pointer; }
  .power b { font-size: 13px; }
  .power small { display: block; color: #999; font-size: 11px; font-weight: normal; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 10px; background: #ccc; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: #ff4d6d; }
  .switch input:checked + span::after { transform: translateX(16px); }
  body.disabled .power { background: #f2f2f2; }
  body.disabled #main { opacity: .4; pointer-events: none; }
</style>
</head>
<body>
  <label class="power">
    <span><b id="powerText">켜짐</b><small id="powerSub">좋아요한 글을 표시하고 기록 중</small></span>
    <span class="switch"><input type="checkbox" id="enabled"><span></span></span>
  </label>
  <div id="main">
  <h1>표시 방식</h1>
  <div class="chips">
    <label><input type="radio" name="mode" value="bg"><span class="pv"><span class="bg"></span></span>배경</label>
    <label><input type="radio" name="mode" value="bg_heart"><span class="pv"><span class="bg"></span><span class="heart">♥</span></span>배경+하트</label>
    <label><input type="radio" name="mode" value="heart"><span class="pv"><span class="heart">♥</span></span>하트만</label>
  </div>
  <div id="style">
    <h2>하트 모양</h2>
    <div class="chips">
      <label><input type="radio" name="heartStyle" value="text"><span class="pv"><span class="heart">♥ 좋아요</span></span>글자</label>
      <label><input type="radio" name="heartStyle" value="icon"><span class="pv"><span class="heart">♥</span></span>아이콘</label>
    </div>
  </div>
  <label class="opt" title="글을 보다가 새로고침하면 같은 글의 읽던 위치로 돌아가요 (목록 화면은 제외)"><input type="checkbox" id="keep">새로고침해도 읽던 위치 유지</label>
  <div class="count" id="count"></div>
  <div id="jump">
    <h2 class="sec">최근 좋아요한 글로 이동</h2>
    <p class="imsg" id="jmsg">확인하는 중…</p>
    <div class="ibtns" id="jbtns"></div>
  </div>
  <div id="import">
    <h2 class="sec">좋아요한 글 가져오기</h2>
    <p class="imsg" id="imsg">확인하는 중…</p>
    <div class="ibtns" id="ibtns"></div>
  </div>
  </div>
  <div id="diag" style="display:none">
    <h2 class="sec">진단 기록 (테스트용)</h2>
    <p class="imsg" id="dmsg">문제가 생긴 뒤 [복사]를 눌러 붙여 넣어 주세요.</p>
    <div class="ibtns"><button class="primary" id="dview">기록 보기</button><button id="dcopy">복사</button><button id="dclear">지우기</button></div>
    <pre id="dlog" style="display:none;margin:8px 0 0;max-height:260px;overflow:auto;padding:6px;border-radius:6px;background:#f6f6f8;font:10px/1.45 monospace;white-space:pre-wrap;word-break:break-all"></pre>
  </div>
  <script src="popup.js"></script>
</body>
</html>
