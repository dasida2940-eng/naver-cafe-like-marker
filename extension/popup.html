<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  body { width: 220px; margin: 0; padding: 14px; font: 13px "Malgun Gothic", sans-serif; color: #222; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  label:hover { background: #f5f5f5; }
  .bg { display: inline-block; width: 26px; height: 14px; background: #fff0f3; border: 1px solid #f3c2cd; border-radius: 3px; }
  .heart { display: inline-block; width: 15px; height: 15px; border-radius: 50%; background: #ff4d6d; color: #fff; font: bold 9px/15px Arial, sans-serif; text-align: center; }
  .count { margin-top: 10px; color: #888; font-size: 12px; }
</style>
</head>
<body>
  <h1>좋아요한 글 표시 방식</h1>
  <label><input type="radio" name="mode" value="bg"> <span class="bg"></span> 배경만</label>
  <label><input type="radio" name="mode" value="bg_heart"> <span class="bg"></span><span class="heart">♥</span> 배경 + 하트</label>
  <label><input type="radio" name="mode" value="heart"> <span class="heart">♥</span> 하트만</label>
  <div class="count" id="count"></div>
  <script src="popup.js"></script>
</body>
</html>
