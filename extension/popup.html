<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  body { width: 220px; margin: 0; padding: 14px; font: 13px "Malgun Gothic", sans-serif; color: #222; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  h2 { font-size: 13px; margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid #eee; }
  label { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  label:hover { background: #f5f5f5; }
  .bg { display: inline-block; width: 26px; height: 14px; background: #fff0f3; border: 1px solid #f3c2cd; border-radius: 3px; }
  .heart { display: inline-block; padding: 0 5px; border-radius: 8px; background: #ff4d6d; color: #fff; font-size: 10px; line-height: 15px; font-weight: bold; }
  .heart.text { padding: 0 6px; }
  .heart.icon { padding: 0 5px; }
  #style.off { opacity: .4; pointer-events: none; }
  .count { margin-top: 10px; color: #888; font-size: 12px; }
  .imsg { margin: 0 0 8px; color: #555; font-size: 12px; line-height: 1.5; white-space: pre-line; }
  .imsg b { color: #d63a5a; }
  .ibtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .ibtns button { padding: 6px 10px; border: 1px solid #e3e3e8; border-radius: 6px; background: #f6f6f8; color: #333; font: bold 12px "Malgun Gothic", sans-serif; cursor: pointer; }
  .ibtns button:hover { background: #ececf0; }
  .ibtns button.primary { border-color: #ff4d6d; background: #ff4d6d; color: #fff; }
  .ibtns button.primary:hover { background: #f03a5c; }
  .power { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: #fff0f3; cursor: pointer; }
  .power b { font-size: 13px; }
  .power small { display: block; color: #999; font-size: 11px; font-weight: normal; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 10px; background: #ccc; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: #ff4d6d; }
  .switch input:checked + span::after { transform: translateX(16px); }
  body.disabled .power { background: #f2f2f2; }
  body.disabled #main { opacity: .4; pointer-events: none; }
</style>
</head>
<body>
  <label class="power">
    <span><b id="powerText">켜짐</b><small id="powerSub">좋아요한 글을 표시하고 기록해요</small></span>
    <span class="switch"><input type="checkbox" id="enabled"><span></span></span>
  </label>
  <div id="main">
  <h1>좋아요한 글 표시 방식</h1>
  <label><input type="radio" name="mode" value="bg"> <span class="bg"></span> 배경만</label>
  <label><input type="radio" name="mode" value="bg_heart"> <span class="bg"></span><span class="heart icon">♥</span> 배경 + 하트</label>
  <label><input type="radio" name="mode" value="heart"> <span class="heart icon">♥</span> 하트만</label>

  <div id="style">
    <h2>하트 모양</h2>
    <label><input type="radio" name="heartStyle" value="text"> <span class="heart text">♥ 좋아요</span></label>
    <label><input type="radio" name="heartStyle" value="icon"> <span class="heart icon">♥</span> 아이콘만</label>
  </div>

  <div class="count" id="count"></div>
  <div id="jump">
    <h2>최근 좋아요한 글로 이동</h2>
    <p class="imsg" id="jmsg">확인하는 중…</p>
    <div class="ibtns" id="jbtns"></div>
  </div>
  <div id="import">
    <h2>좋아요한 글 가져오기</h2>
    <p class="imsg" id="imsg">확인하는 중…</p>
    <div class="ibtns" id="ibtns"></div>
  </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
