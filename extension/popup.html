<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  body { width: 220px; margin: 0; padding: 14px; font: 13px "Malgun Gothic", sans-serif; color: #222; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  h2 { font-size: 13px; margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid #eee; }
  label { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  label:hover { background: #f5f5f5; }
  .bg { display: inline-block; width: 26px; height: 14px; background: #fff0f3; border: 1px solid #f3c2cd; border-radius: 3px; }
  .heart { display: inline-block; padding: 0 5px; border-radius: 8px; background: #ff4d6d; color: #fff; font-size: 10px; line-height: 15px; font-weight: bold; }
  .heart.text { padding: 0 6px; }
  .heart.icon { padding: 0 5px; }
  #style.off { opacity: .4; pointer-events: none; }
  .count { margin-top: 10px; color: #888; font-size: 12px; }
  .backup { margin-top: 10px; width: 100%; padding: 7px 0; border: 1px solid #e3e3e8; border-radius: 6px; background: #fafafa; font: 12px "Malgun Gothic", sans-serif; color: #444; cursor: pointer; }
  .backup:hover { background: #f0f0f3; }
</style>
</head>
<body>
  <h1>좋아요한 글 표시 방식</h1>
  <label><input type="radio" name="mode" value="bg"> <span class="bg"></span> 배경만</label>
  <label><input type="radio" name="mode" value="bg_heart"> <span class="bg"></span><span class="heart icon">♥</span> 배경 + 하트</label>
  <label><input type="radio" name="mode" value="heart"> <span class="heart icon">♥</span> 하트만</label>

  <div id="style">
    <h2>하트 모양</h2>
    <label><input type="radio" name="heartStyle" value="text"> <span class="heart text">♥ 좋아요</span></label>
    <label><input type="radio" name="heartStyle" value="icon"> <span class="heart icon">♥</span> 아이콘만</label>
  </div>

  <div class="count" id="count"></div>
  <button id="backup" class="backup">기록 백업·가져오기</button>
  <script src="popup.js"></script>
</body>
</html>
